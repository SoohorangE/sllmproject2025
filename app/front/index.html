<!DOCTYPE html>
<html lang="kr">
<head>
  <title>smart chatting</title>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <style>
    textarea {
      width: 100%;
      height: 150px;
      resize: vertical;
      padding: 1rem;
      font-size: 1rem;
      border-radius: 8px;
    }
    .container {
      max-width: 800px;
    }
  </style>
</head>
<body>
  <div class="p-5 bg-primary text-white text-center">
    <h1>수호의 첫 지능 채팅 서비스</h1>
    <p class="lead">Gemma 2B Text Generator</p>
  </div>

  <div class="container my-5">
    <div class="card shadow p-4">
      <h4 class="mb-3">📝 프롬프트 입력</h4>
      <textarea id="text" placeholder="예: 이순신 장군에 대해 알려줘"></textarea>

      <div class="d-flex justify-content-end mt-3">
        <button class="btn btn-primary" onclick="generateText()">
          🚀 Generate
        </button>
      </div>

      <hr class="my-4">

      <h4 class="mb-3">💬 생성 결과</h4>
      <textarea id="answer" readonly placeholder="여기에 결과가 표시됩니다."></textarea>
    </div>
  </div>

  <script>
    function generateText() {
  const prompt = $("#text").val();
  $("#answer").val("⏳ Generating...");

  fetch("http://127.0.0.1:8000/answer", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ prompt: prompt })
  })
  .then(response => response.json())
  .then(data => {
    $("#answer").val(data.result);
  })
  .catch(error => {
    console.error("Error:", error);
    $("#answer").val("⚠️ 에러 발생!");
  });
}
  </script>
</body>
</html>
